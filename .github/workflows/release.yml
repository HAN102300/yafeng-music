name: Release Desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Next standalone
        run: npm run build
        env:
          DESKTOP_BUILD: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Merge static/public into standalone
        shell: pwsh
        run: |
          robocopy ".next/static" ".next/standalone/.next/static" /MIR /NFL /NDL /NJH /NJS /NP
          robocopy "public" ".next/standalone/public" /MIR /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit 1 }

      - name: Sync standalone into src-tauri resources
        shell: pwsh
        run: |
          robocopy ".next/standalone" "src-tauri/resources/next-server" /MIR /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit 1 }

      - name: Prepare node sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          $nodeSrc = (Get-Command node).Source
          Copy-Item $nodeSrc "src-tauri/binaries/node-x86_64-pc-windows-msvc.exe" -Force
          Write-Host "sidecar 源: $nodeSrc"

      - name: Cache NSIS toolchain (avoid transient 504)
        shell: pwsh
        run: |
          $nsisDir = "$env:LOCALAPPDATA\tauri\NSIS"
          if (Test-Path "$nsisDir\Bin\makensis.exe") { Write-Host "NSIS cached"; exit 0 }
          $zip = "$env:RUNNER_TEMP\nsis-3.13.zip"
          foreach ($i in 1..3) {
            try {
              Invoke-WebRequest -Uri "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip" -OutFile $zip -MaximumRedirection 5
              break
            } catch { Write-Host "retry $i"; Start-Sleep 5 }
          }
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\tauri" | Out-Null
          tar -xf $zip -C "$env:LOCALAPPDATA\tauri"
          if (Test-Path "$env:LOCALAPPDATA\tauri\nsis-3.13") { Rename-Item "$env:LOCALAPPDATA\tauri\nsis-3.13" "NSIS" }
          $dll = "$env:RUNNER_TEMP\nsis_tauri_utils.dll"
          foreach ($i in 1..3) {
            try {
              Invoke-WebRequest -Uri "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll" -OutFile $dll -MaximumRedirection 5
              break
            } catch { Write-Host "retry $i"; Start-Sleep 5 }
          }
          New-Item -ItemType Directory -Force -Path "$nsisDir\Plugins\x86-unicode\additional" | Out-Null
          Copy-Item $dll "$nsisDir\Plugins\x86-unicode\additional\nsis_tauri_utils.dll" -Force

      - name: Bundle (sign updater artifacts)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "雅枫音乐 ${{ github.ref_name }}"
          releaseBody: "详见下方 Assets（安装包 + 自动更新文件）。安装包含完整离线能力。"
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
